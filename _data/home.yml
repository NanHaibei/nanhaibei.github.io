hero:
  eyebrow: Hello, I'm
  name: Yuzhi Jiang
  bio: >-
    I am a master's student in Control Science and Engineering at Huazhong University of
    Science and Technology. I work on learning-based motion control for humanoid and
    quadrupedal robots, from reinforcement learning and whole-body control to real-robot
    deployment. My recent work includes compliant whole-body control at XPENG Robotics
    and omnidirectional stair locomotion on the Unitree G1.

    I welcome research collaborations and discussions.
  image: /assets/img/avatar2.jpg
  links:
