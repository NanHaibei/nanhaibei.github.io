      url: mailto:m202473708@hust.edu.cn
    - label: GitHub
      url: https://github.com/NanHaibei

internships:
  - company: XPENG Robotics
    logo: /assets/img/xpeng-logo.png
    role: Embodied AI Algorithm Intern
    location: China
    period: Jun 2026 - Aug 2026
    details:
      - Reproduced the compliant CHIP whole-body controller based on NVIDIA SONIC and deployed CHIP and GentleHumanoid on Unitree G1 and XPENG IRON.
      - Integrated SONIC with GR00T across teleoperation, data collection, fine-tuning, and real-robot deployment, connecting VLA planning with low-level whole-body control for loco-manipulation tasks.
      - Used LIMMT for motion-data selection and PAE latent representations with interpolation to broaden the whole-body-control training distribution.

  - company: Hubei Qiling Robotics
    logo: /assets/img/qi_logo.png
    role: Motion Control Algorithm Intern
    location: Wuhan, China
    period: Apr 2024 - May 2026
    details:
      - Trained and deployed imitation-learning and reinforcement-learning locomotion policies for the "Shennong" humanoid and "Chitu" quadruped.
      - Built an Isaac Lab training framework with modular AMP, Periodic Gait, and VAE components.
      - Developed ROS2-based MuJoCo Sim2Sim and policy-deployment frameworks using state machines for rapid validation on different robots.

  - company: Hangzhou Lingwen Technology
    role: Algorithm Intern
    location: Hangzhou, China
    period: Oct 2023 - Apr 2024
    details:
      - Contributed to EtherCAT bus SDK integration with Acontis and IgH, servo-motor communication tests, robot prototype integration, and physical testing.

