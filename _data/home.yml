projects:
  - name: Compliant Whole-Body Control for Humanoid Robots
    period: Jun 2026 - Aug 2026
    description: >-
      Reproduced CHIP on top of NVIDIA SONIC and built automated compliance tests in
      MuJoCo. Deployed CHIP and GentleHumanoid on Unitree G1 and XPENG IRON, enabling
      adjustable arm compliance while tracking a reference motion. Tested physical
      interaction in handshake and blackboard-wiping tasks.
    video: /assets/video/g1-compliance.mp4
    poster: /assets/video/g1-compliance.jpg
    video_caption: Unitree G1 — compliant arm response

  - name: Omnidirectional Humanoid Stair Locomotion
    period: Oct 2025 - Mar 2026
    image: /assets/img/IROS2026.gif
    description: >-
      Developed a single-stage perceptive locomotion policy with dense unsafe-stepping
      penalties and a LiDAR elevation-map pipeline with spatiotemporal confidence decay
      and an edge-guided U-Net. Deployed zero-shot on Unitree G1. The system achieved a
      near-100% safe-stepping rate in simulation and completed a continuous 400 m outdoor
      test over complex terrain.
    links:
      - label: Paper
        url: https://arxiv.org/abs/2603.07928

  - name: Humanoid and Quadruped Reinforcement Learning Control
    period: Apr 2024 - May 2026
    image: /assets/img/shennong_walk.gif
    description: >-
      Used Periodic Gait, AMASS motion retargeting, AMP, and AE/VAE state estimation to
      train robust humanoid walking. Built a state-machine control framework and
      terrain-adaptive locomotion policies for a quadruped. Deployed the policies on
      Qiling Robotics' "Shennong" humanoid and "Chitu" quadruped.

  - name: Bipedal Wheeled Robot RL Motion Control
    period: Jun 2024
    image: /assets/img/lunzu.png
    description: >-
      Undergraduate thesis project. Exported a self-developed robot model from
      SolidWorks to URDF and trained locomotion policies in Isaac Gym with Legged Gym.
      Achieved velocity tracking, terrain traversal, and resistance to disturbances,
      using an autoencoder to estimate velocity.

  - name: Motion Target Control and Tracking System
    period: 2023
    image: /assets/img/diansai.jpeg
    description: >-
      Built the two-axis gimbal and STM32 control software for an autonomous target
      tracking system. The team won First Prize in the 2023 National Undergraduate
      Electronic Design Contest.
